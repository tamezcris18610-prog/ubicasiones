<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welsys - Enlaces</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="container">
    <!-- Título dorado con borde negro -->
    <h1 class="main-title">Welsys</h1>

    <!-- Barra de búsqueda (inicialmente oculta) -->
    <input type="text" id="searchInput" placeholder="Buscar Ubicasiones..." class="hidden" />

    <!-- Botones actualizados: 7 categorías -->
    <div class="buttons">
      <button id="btn-PME">PME</button>
      <button id="btn-PMG">PMG</button>
      <button id="btn-PMSC">PMSC</button>
      <button id="btn-PMB24">PMB24</button>
      <button id="btn-PMM">PMM</button>
      <button id="btn-PMU">PMU</button>
      <button id="btn-PMP">PMP</button>
    </div>

    <!-- Lista de enlaces -->
    <ul id="linksList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
